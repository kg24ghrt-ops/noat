
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;30.0.16248370
            cmake;3.31.6

      - name: Validate release signing secrets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "${ANDROID_KEYSTORE_BASE64}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${ANDROID_KEY_ALIAS}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${ANDROID_KEY_PASSWORD}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Warning: signing secrets missing for same-repository PR; building unsigned: ${missing[*]}"
            else
              echo "Error: Required signing secrets are missing for ${{ github.event_name }}: ${missing[*]}"
              echo "Configure these repository secrets to enable signed release builds."
              exit 1
            fi
          fi

      - name: Prepare release keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Warning: no signing keystore for same-repository PR; building unsigned."
            else
              echo "Error: ANDROID_KEYSTORE_BASE64 secret is missing for ${{ github.event_name }}."
              exit 1
            fi
          else
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/noat-release.jks"
            chmod 600 "$RUNNER_TEMP/noat-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/noat-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore prepared at $RUNNER_TEMP/noat-release.jks"
          fi

      - name: Build host corrade-rc (required to cross-compile vendored Corrade)
        run: |
          if [ ! -d third_party/corrade ]; then
            echo "third_party/corrade not present in repository; skipping corrade-rc build (not an approved dependency per CMakeLists.txt)."
            exit 0
          fi
          cmake -S third_party/corrade -B build/host-corrade \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_INTERCONNECT=OFF \
            -DWITH_PLUGINMANAGER=OFF \
            -DWITH_TESTSUITE=OFF \
            -DWITH_UTILITY=ON \
            -DWITH_MAIN=OFF \
            -DWITH_RC=ON \
            -DBUILD_STATIC=OFF \
            -DBUILD_STATIC_PIC=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build/host-corrade --target corrade-rc
          CORRADE_RC="$(find build/host-corrade -name corrade-rc -type f | head -n 1)"
          if [ -z "$CORRADE_RC" ]; then
            echo "Error: corrade-rc was not built"
            exit 1
          fi
          echo "CORRADE_RC_EXECUTABLE=$CORRADE_RC" >> "$GITHUB_ENV"
          echo "corrade-rc: $CORRADE_RC"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CORRADE_RC_EXECUTABLE: ${{ env.CORRADE_RC_EXECUTABLE }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Verify release APK signature
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_FILE}" ] || [ ! -f "${ANDROID_KEYSTORE_FILE}" ]; then
            echo "No release keystore present; skipping APK signature verification (unsigned build)."
            exit 0
          fi
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No release APK found to verify."
            exit 0
          fi
          apksigner_path=""
          for bt in "$ANDROID_SDK_ROOT"/build-tools/*/apksigner; do
            [ -f "$bt" ] && apksigner_path="$bt" && break
          done
          if [ -z "$apksigner_path" ]; then
            echo "apksigner not found in $ANDROID_SDK_ROOT/build-tools; skipping signature verification."
            exit 0
          fi
          echo "Verifying signature of $apk with $apksigner_path ..."
          if "$apksigner_path" verify --print-certs "$apk"; then
            echo "Release APK signature verified."
          else
            echo "Warning: release APK signature verification reported issues (see output above)."
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: noat-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  cxx-unit-tests:
    name: Run C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;30.0.16248370
            cmake;3.31.6

      - name: Install system Vulkan headers (for C unit tests)
        run: sudo apt-get update -y && sudo apt-get install -y zlib1g-dev libvulkan-dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CORRADE_RC_EXECUTABLE: ${{ env.CORRADE_RC_EXECUTABLE }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Compile C Vulkan unit tests (verify vulkan.h header resolution)
        run: |
          # Compile-only on host Linux: Android NDK libs (-landroid -llog)
          # are not available, so we verify header resolution without linking.
          clang -std=c11 -Wall -Wextra -Wpedantic -c \
            -I app/src/main/cpp \
            -I "$ANDROID_NDK_ROOT/source/android/vulkan/include" \
            tests/noat_vulkan_test.c \
            -o /tmp/noat_vulkan_test.o
          echo "=== noat_vulkan_test.c compiled successfully ==="

          clang -std=c11 -Wall -Wextra -Wpedantic -c \
            -I app/src/main/cpp \
            -I "$ANDROID_NDK_ROOT/source/android/vulkan/include" \
            tests/noat_engine_test.c \
            -o /tmp/noat_engine_test.o
          echo "=== noat_engine_test.c compiled successfully ==="

      - name: Compile and run PNG/A4 unit test
        run: |
          clang++ -Wall -Wextra -Wpedantic -std=c++17 \
            -I app/src/main/cpp \
            app/src/main/cpp/png_codec.cpp \
            tests/noat_png_test.cpp \
            -o noat_png_test -lz
          echo "=== Running PNG/A4 unit tests ==="
          ./noat_png_test > noat_png_report.json
          cat noat_png_report.json
          echo "=== C++ unit tests complete ==="

      - name: Upload JSON test report
        uses: actions/upload-artifact@v6
        with:
          name: noat-cxx-test-report
          path: noat_png_report.json
          retention-days: 14
